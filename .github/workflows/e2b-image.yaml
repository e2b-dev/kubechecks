name: e2b image build

# Builds the e2b downstream kubechecks image. See DOWNSTREAM.md.
#
# Push a tag vX.Y.Z-e2b.N (X.Y.Z is the upstream release the branch is based on,
# N our counter) on a commit that is on the `downstream` branch. This workflow is
# gated to e2b-dev/kubechecks and never runs upstream.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-e2b.[0-9]+'

jobs:
  image-publish:
    if: github.repository == 'e2b-dev/kubechecks'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/e2b-dev/kubechecks

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag can be pushed on any commit; only what is on `downstream` may ship.
      - name: Require the tagged commit to be on downstream
        run: |
          git fetch --no-tags origin downstream:refs/remotes/origin/downstream
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/downstream; then
            echo "::error::$GITHUB_SHA ($GITHUB_REF_NAME) is not on the downstream branch; refusing to build it"
            exit 1
          fi

      - name: Parse tool versions
        uses: wistia/parse-tool-versions@v2.1.1

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG }}
          cache: false

      # Same binaries and runtime image as upstream's release workflow.
      - name: Build binaries
        run: |
          mkdir -p docker-context
          for arch in amd64 arm64; do
            env CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build \
                -trimpath \
                -ldflags="-s -w \
                  -X github.com/zapier/kubechecks/pkg.GitCommit=$GITHUB_SHA \
                  -X github.com/zapier/kubechecks/pkg.GitTag=$GITHUB_REF_NAME" \
                -o docker-context/kubechecks-$arch \
                .
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
